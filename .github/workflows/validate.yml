name: Validate portfolio
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check script.js
          node --check scroll-story.js
          node --check i18n.js
          node --check check-studio-copy.js
          node check-studio-copy.js
          node --check check-2day-links.js
          node check-2day-links.js
          node --check assets/society5ive/script.js
      - name: Check local HTML links and assets
        run: |
          python3 check-site.py
          python3 check-theme-contrast.py
          python3 asset-versions.py --check

  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install accessibility test tools outside the checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/portfolio-a11y" --no-save --ignore-scripts playwright@1.62.1 axe-core@4.14.0
          node "$RUNNER_TEMP/portfolio-a11y/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check WCAG rules and keyboard interactions
        env:
          NODE_PATH: ${{ runner.temp }}/portfolio-a11y/node_modules
          A11Y_RESULTS: ${{ runner.temp }}/accessibility-results.json
        run: |
          python3 -m http.server 8010 --bind 127.0.0.1 > "$RUNNER_TEMP/portfolio-server.log" 2>&1 &
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8010/index.html > /dev/null
          node tests/accessibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: ${{ runner.temp }}/accessibility-results.json
