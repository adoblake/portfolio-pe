name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4

      - name: Check site source and references
        run: |
          node --check script.js
          node --check scroll-story.js
          node --check i18n.js
          python3 check-site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
